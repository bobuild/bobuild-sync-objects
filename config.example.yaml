# Copy to config.yaml and fill in real values. Do not commit secrets.
#
# Create API keys in each app: Settings → API → API Keys, then enable them
# on every sync endpoint (Authentication → API Key).
# See https://docs.bobuild.com/advanced/api/
#
# api_key may be a literal string or ${ENV_VAR} (whole value). Use one env
# var per key; inject from Secrets Manager / SSM / ECS secrets in production.
#
# Each job has its own source, tables (FK order), and targets.
# Failures on one job/table/target do not block the others.
#
# max_file_size_mb caps downloaded file/image fields (default 100). Oversized
# files skip that record (error on stderr) to avoid container OOM.
# max_file_size_mb: 100

jobs:
  - name: catalog
    tables:
      - category
      - name: product
        file_fields: [cover, datasheet] # optional; omit for tables without files
    source:
      domain: source.example.com
      api_key: ${SYNC_SOURCE_KEY}
      path_prefix: /sync
      # insecure_skip_verify: true  # only if TLS cert is untrusted (private CA)
    targets:
      - domain: replica.example.com
        api_key: ${SYNC_REPLICA_KEY}
        path_prefix: /sync
      - domain: other-replica.example.com
        api_key: "REPLACE_ME" # literal also fine for local use
        path_prefix: /sync
        # host: ingress.internal
        # port: "80"
